font_family      Hack Nerd Font
font_size        13.0
background_opacity 0.92
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam

foreground #f5f7ff
background #11111b
selection_background #89b4fa
selection_foreground #181825

color0  #45475a
color8  #585b70
color1  #ff5c7c
color9  #ff7a93
color2  #50fa7b
color10 #69ff94
color3  #ffd23f
color11 #ffe073
color4  #4dabff
color12 #78c0ff
color5  #c084ff
color13 #d3a4ff
color6  #00e5ff
color14 #5df0ff
color7  #e6ebff
color15 #ffffff

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# --- atajos extra ---
map ctrl+shift+alt+comma  previous_tab
map ctrl+shift+alt+period next_tab
