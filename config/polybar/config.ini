[colors]
bg = #00000000
fg = #cdd6f4

[module/logo]
type = custom/script
exec = /home/k3nfa/.config/polybar/scripts/info.sh logo
interval = 600

[module/ip]
type = custom/script
exec = /home/k3nfa/.config/polybar/scripts/info.sh ip
interval = 5

[module/vpn]
type = custom/script
exec = /home/k3nfa/.config/polybar/scripts/info.sh vpn
interval = 3

[module/workspaces]
type = custom/script
exec = /home/k3nfa/.config/polybar/scripts/ws.sh
tail = true

[module/updates]
type = custom/script
exec = /home/k3nfa/.config/polybar/scripts/info.sh updates
interval = 1800

[module/date]
type = custom/script
exec = /home/k3nfa/.config/polybar/scripts/info.sh date
interval = 30

[module/target]
type = custom/script
exec = /home/k3nfa/.config/polybar/scripts/info.sh target
interval = 2

[module/power]
type = custom/script
exec = /home/k3nfa/.config/polybar/scripts/info.sh power
interval = 600
click-left = bspc quit

[bar/base]
width = 200
height = 36
offset-y = 8
radius = 14
background = #1e1e2e
foreground = #f5f7ff
font-0 = "Hack Nerd Font:size=11;3"
font-1 = "Hack Nerd Font:size=15;4"
font-2 = "Hack Nerd Font Mono:size=16;4"
font-3 = "Hack Nerd Font Mono:size=12;3"
font-4 = "Hack Nerd Font Mono:size=7;3"
override-redirect = false
enable-ipc = true
wm-restack = bspwm


[bar/logo]
inherit = bar/base
offset-x = 10
offset-y = 8
modules-center = logo

[bar/ip]
inherit = bar/base
offset-x = 10
offset-y = 52
modules-center = ip

[bar/vpn]
inherit = bar/base
offset-x = 10
offset-y = 96
modules-center = vpn

[bar/workspaces]
inherit = bar/base
offset-x = 10
offset-y = 140
modules-center = workspaces

[bar/updates]
inherit = bar/base
offset-x = 10
offset-y = 184
modules-center = updates

[bar/date]
inherit = bar/base
offset-x = 10
offset-y = 228
modules-center = date

[bar/target]
inherit = bar/base
offset-x = 10
offset-y = 272
modules-center = target

[bar/power]
inherit = bar/base
offset-x = 10
offset-y = 100%:-44
modules-center = power
